<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Calculator Container -->
  <main class="calculator-container">
    <div class="calculator" role="region" aria-label="Calculator">
      
      <!-- Calculator Header -->
      <header class="calculator-header">
        <span class="calculator-title">Calculator</span>
        <span class="keyboard-badge" title="Full keyboard support enabled">⌨ Keyboard Ready</span>
      </header>

      <!-- Display Screen (Shows calculation history and current value) -->
      <section class="display" aria-live="polite">
        <div class="previous-operand" id="previousOperand" aria-label="Previous calculation"></div>
        <div class="current-operand" id="currentOperand" aria-label="Current value">0</div>
      </section>

      <!-- Buttons Grid -->
      <div class="buttons-grid">
        <!-- Row 1: Clear, Delete, Divide -->
        <button type="button" class="btn btn-action btn-clear btn-span-2" data-action="clear" aria-label="All Clear">AC</button>
        <button type="button" class="btn btn-action btn-delete" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button type="button" class="btn btn-operator" data-operator="÷" aria-label="Divide">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button type="button" class="btn btn-number" data-number="7">7</button>
        <button type="button" class="btn btn-number" data-number="8">8</button>
        <button type="button" class="btn btn-number" data-number="9">9</button>
        <button type="button" class="btn btn-operator" data-operator="×" aria-label="Multiply">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button type="button" class="btn btn-number" data-number="4">4</button>
        <button type="button" class="btn btn-number" data-number="5">5</button>
        <button type="button" class="btn btn-number" data-number="6">6</button>
        <button type="button" class="btn btn-operator" data-operator="-" aria-label="Subtract">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button type="button" class="btn btn-number" data-number="1">1</button>
        <button type="button" class="btn btn-number" data-number="2">2</button>
        <button type="button" class="btn btn-number" data-number="3">3</button>
        <button type="button" class="btn btn-operator" data-operator="+" aria-label="Add">+</button>

        <!-- Row 5: 0, Decimal Point, Equals -->
        <button type="button" class="btn btn-number" data-number="0">0</button>
        <button type="button" class="btn btn-number" data-number="." aria-label="Decimal point">.</button>
        <button type="button" class="btn btn-equals btn-span-2" data-action="equals" aria-label="Equals">=</button>
      </div>
    </div>

    <!-- Quick Keyboard Guide -->
    <footer class="calculator-footer">
      <p>Use keyboard: <kbd>0-9</kbd> <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd> <kbd>Enter</kbd> <kbd>Backspace</kbd> <kbd>Esc</kbd></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
